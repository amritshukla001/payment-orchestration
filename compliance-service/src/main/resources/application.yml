server:
  port: 8090

spring:
  application:
    name: compliance-service

  datasource:
    url: jdbc:postgresql://localhost:5432/compliance
    username: payflow
    password: payflow

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

resilience4j:
  retry:
    instances:
      kafka-consumer:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2

paymentengine:
  security:
    api-key: ${PAYMENTENGINE_API_KEY:local-dev-api-key-change-me}

compliance:
  # Real CTR-style regulatory filing happens on attempted transactions at or
  # above a threshold, regardless of whether the payment is later approved.
  aml-threshold-cents: 1000000 # $10,000
