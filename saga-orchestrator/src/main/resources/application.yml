server:
  port: 8082

spring:
  application:
    name: saga-orchestrator

  datasource:
    url: jdbc:postgresql://localhost:5432/orchestrator
    username: payflow
    password: payflow

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

resilience4j:
  retry:
    instances:
      kafka-consumer:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  circuitbreaker:
    instances:
      ai-summarizer:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3

paymentengine:
  security:
    api-key: ${PAYMENTENGINE_API_KEY:local-dev-api-key-change-me}
  ai:
    # Empty default is a normal local-dev state: the summary endpoint then
    # serves the deterministic fallback instead of calling the Gemini API.
    # Get a free key at https://aistudio.google.com/apikey -- no billing
    # required for the free tier. If this model name is retired, check
    # https://ai.google.dev/gemini-api/docs/models for a current one.
    api-key: ${GEMINI_API_KEY:}
    model: gemini-3.1-flash-lite
